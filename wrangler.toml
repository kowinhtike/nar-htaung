# Cloudflare Workers with static assets.
#
# Build command (dashboard or CI):  npm run build
# Deploy command:                   npx wrangler deploy
#
# Only the app shell in dist/ is uploaded (~15 MB). Model weights are fetched
# from Hugging Face by the browser on first load and cached in OPFS, so nothing
# large goes through Cloudflare and every asset stays under the 25 MiB limit.
#
# dist/_headers is parsed by Workers, which is what applies COOP/COEP and makes
# multi-threaded WASM possible.

name = "nar-htaung"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
